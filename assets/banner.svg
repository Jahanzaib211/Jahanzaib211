<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Jahanzaib Ali, Founder and Systems Engineer at AliLabsX">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52f2c5"/>
      <stop offset="1" stop-color="#4aa8ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#52f2c5" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,monospace; }
      .sans { font-family: 'Inter','Segoe UI',Helvetica,Arial,sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .spin { transform-origin: 1010px 150px; animation: spin 40s linear infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <g class="spin" fill="none" stroke="#52f2c5" stroke-opacity="0.35">
    <polygon points="1010,40 1105,95 1105,205 1010,260 915,205 915,95" stroke-width="2"/>
    <line x1="1010" y1="40" x2="1010" y2="260"/>
    <line x1="915" y1="95" x2="1105" y2="205"/>
    <line x1="915" y1="205" x2="1105" y2="95"/>
    <circle cx="1010" cy="150" r="38" stroke-opacity="0.5"/>
  </g>
  <text x="64" y="86" class="mono" font-size="20" fill="#52f2c5">$ ssh founder@alilabsx.com<tspan class="cursor">▍</tspan></text>
  <text x="62" y="160" class="sans" font-size="64" font-weight="800" fill="#f2f4f8" letter-spacing="2">JAHANZAIB ALI</text>
  <rect x="64" y="182" width="120" height="4" rx="2" fill="url(#glow)"/>
  <text x="64" y="224" class="sans" font-size="24" fill="#c9d1e0">Founder &amp; Systems Engineer · <tspan fill="#52f2c5" font-weight="700">AliLabsX</tspan></text>
  <text x="64" y="260" class="mono" font-size="16" fill="#7d8799">self-hosted AI · AI teammates · agent sandboxes · local inference · Lahore</text>
</svg>
